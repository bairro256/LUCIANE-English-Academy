<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c2c">
<meta name="description" content="LUCIANE Academic Sciences — portal React de aprendizagem e avaliação.">
<title>LUCIANE Academic Sciences · React Staging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<link rel="stylesheet" href="./staging.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<div id="root"><div class="boot">LUCIANE <span>ACADEMIC SCIENCES</span><small>A preparar o ambiente académico…</small></div></div>
<script>
(function(){
 const root=document.getElementById("root");
 function fail(message){
  if(root && root.dataset.ready!=="true"){
   root.innerHTML='<div class="boot">LUCIANE <span>ACADEMIC SCIENCES</span><small style="max-width:320px;line-height:1.6;margin:16px auto 0">A aplicação não conseguiu iniciar. Verifica a ligação à internet e recarrega a página. Detalhe: '+String(message||"falha ao carregar os módulos").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+'</small></div>';
  }
 }
 window.addEventListener("error",function(e){if(e.target&&e.target.tagName==="SCRIPT")fail("módulo não carregado: "+(e.target.src||"script"));else if(e.message)fail(e.message)},true);
 window.addEventListener("unhandledrejection",function(e){fail(e.reason&&e.reason.message||"erro de ligação ou autenticação")});
 window.setTimeout(function(){if(root&&root.dataset.ready!=="true")fail("tempo de inicialização excedido")},18000);
})();
</script>
<script type="module" src="./staging.js"></script>
</body>
</html>
