name: Deploy LUCIANE English Academy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "app.js"
      - "arena.css"
      - "arena.html"
      - "arena.js"
      - "icon.svg"
      - "index.html"
      - "practice-zone.css"
      - "practice-zone.html"
      - "practice-zone.js"
      - "styles.css"
      - "sw.js"
      - "tutor.html"
      - "science/**"
      - "sciences/**"
      - "tutor/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare complete academy website
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
