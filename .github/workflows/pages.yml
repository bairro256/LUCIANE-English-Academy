name: Deploy LUCIANE English Academy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "app.js"
      - "arena.css"
      - "arena.html"
      - "arena.js"
      - "icon.svg"
      - "index.html"
      - "practice-zone.css"
      - "practice-zone.html"
      - "practice-zone.js"
      - "styles.css"
      - "sw.js"
      - "tutor.html"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import all published Wix website files into the repository
        env:
          BASE_URL: https://headless-pyuqkzcyeek-zmpgsy7snn-140a.wix-site-host.com
        run: |
          set -euo pipefail
          files=(
            app.js
            arena.css
            arena.html
            arena.js
            icon.svg
            index.html
            practice-zone.css
            practice-zone.html
            practice-zone.js
            styles.css
            sw.js
            tutor.html
          )
          for file in "${files[@]}"; do
            echo "Importing $file"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 120 "$BASE_URL/$file" -o "$file"
            test -s "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "Migrate published LUCIANE Academy site from Wix"
            git push
          fi

      - name: Prepare complete academy website
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
